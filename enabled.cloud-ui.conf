server {
    listen       80;
    server_name  _;

    # Files from public/static-files/ (e.g. the appliance installer). No SPA
    # fallback here: a wrong path must 404, not return index.html with a 200
    # that `curl -sf ... | bash` would then try to execute.
    location /static-files/ {
        root   /usr/share/nginx/html;
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
